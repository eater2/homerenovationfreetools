name: Ratings and generated files

on:
  pull_request:
    paths: [data/**, scripts/**, README.md, catalog.json, llms.txt]
  schedule:
    - cron: "30 6 * * 1" # every Monday 06:30 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generated files are up to date
        if: github.event_name == 'pull_request'
        run: |
          python scripts/build.py
          git diff --exit-code || (echo "Edit data/tools.json, run python scripts/build.py and commit the result." && exit 1)

      - name: Fetch ratings and rebuild
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/fetch_ratings.py
          python scripts/build.py

      - name: Commit
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/ratings.json README.md catalog.json llms.txt
          git diff --cached --quiet || (git commit -m "Weekly ratings $(date -u +%F)" && git push)
